<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src='/index.global.js'></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    #calendar {
      max-width: 100%;
      margin: 0 auto;
      padding: 10px;
      height: 100vh;
    }

    /* Base calendar styling overrides */
    .fc-event {
      cursor: pointer;
      padding: 4px 6px;
      font-size: 0.85rem;
      border-radius: 3px;
    }

    .fc-toolbar-title {
      font-size: 1.2rem !important;
    }

    .fc-button {
      padding: 0.4em 0.8em !important;
      font-size: 0.9rem !important;
      border-radius: 50% !important;
    }

    .fc-button-group {
      gap: 6px;
    }

    /* Classification Styles (Tags) */
    .class-medical {
      background-color: #e3f2fd !important;
      border-left: 4px solid #1e88e5 !important;
      color: #0d47a1 !important;
    }

    .class-business {
      background-color: #ede7f6 !important;
      border-left: 4px solid #5e35b1 !important;
      color: #4a148c !important;
    }

    .class-personal {
      background-color: #e8f5e9 !important;
      border-left: 4px solid #43a047 !important;
      color: #1b5e20 !important;
    }

    .filter-container {
      display: flex;
      gap: 10px;
      padding: 10px;
      max-width: 100%;
      margin: 0 auto;
    }

    /* Formats the labels into matching capsule style */
    .filter-pill {
      padding: 0.5em 1.2em;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      user-select: none;
    }

    /* Hides events when their tag is unchecked */
    .fc-list-event.hidden-event {
      display: none !important;
    }

    /* Mobile-specific adjustments */
    @media (max-width: 768px) {
      #calendar {
        padding: 5px;
      }

      .fc-event {
        padding: 3px 5px;
        font-size: 0.8rem;
      }

      .fc-toolbar-title {
        font-size: 1rem !important;
      }

      .fc-button {
        padding: 0.3em 0.6em !important;
        font-size: 0.8rem !important;
        border-radius: 50% !important;
      }

      .fc-button-group {
        gap: 6px;
      }

      .fc-list-day-text,
      .fc-list-day-side-text {
        font-size: 0.9rem;
      }
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'listMonth',
        height: '100%',
        contentHeight: 'auto',
        aspectRatio: 1.3,
        headerToolbar: {
          left: 'prev,next',
          center: 'title',
          right: 'dayGridMonth,listMonth'
        },
        eventClassNames: function (arg) {
          if (arg.event.classNames.length) {
            return arg.event.classNames;
          }
          return [];
        },
        eventClick: function (info) {
          if (info.event.url) {
            info.jsEvent.preventDefault();
            window.open(info.event.url, '_blank');
          }
        },
        events: [
          {
            title: 'All Day Event',
            start: '2026-05-01',
            className: 'class-medical'
          },
          {
            title: 'Long Event',
            start: '2026-05-07',
            end: '2026-05-10',
            className: 'class-personal'
          },
          {
            groupId: '999',
            title: 'Repeating Event',
            start: '2026-05-09T16:00:00'
          },
          {
            groupId: '999',
            title: 'Repeating Event',
            start: '2026-05-16T16:00:00'
          },
          {
            title: 'Conference',
            start: '2026-05-11',
            end: '2026-05-13'
          },
          {
            title: 'Meeting',
            start: '2026-05-12T10:30:00',
            end: '2026-05-12T12:30:00'
          },
          {
            title: 'Lunch',
            start: '2026-05-12T12:00:00'
          },
          {
            title: 'Meeting',
            start: '2026-05-12T14:30:00'
          },
          {
            title: 'Birthday Party',
            start: '2026-05-13T07:00:00'
          },
          {
            title: 'Click for Google',
            url: 'https://google.com/',
            start: '2026-05-28'
          },
          {
            title: 'Dentist Checkup',
            start: '2026-05-25T10:00:00',
            end: '2026-05-25T11:30:00',
            className: 'class-medical'
          },
          {
            title: 'Quarterly Board Meeting',
            start: '2026-05-27T14:00:00',
            end: '2026-05-27T16:00:00',
            className: 'class-business'
          },
          {
            title: 'Dinner with Parents',
            start: '2026-05-29T19:00:00',
            className: 'class-personal'
          }
        ]
      });

      window.filterEvents = function () {
        // Find all unchecked tag values
        const activeTags = Array.from(document.querySelectorAll('.filter-container input:checked')).map(el => el.value);

        // Loop through all rendered list event rows
        document.querySelectorAll('.fc-list-event').forEach(row => {
          // Check if row has any of the classification classes
          const hasMedical = row.classList.contains('class-medical');
          const hasBusiness = row.classList.contains('class-business');
          const hasPersonal = row.classList.contains('class-personal');

          // Determine if this row belongs to any tag category
          let rowTag = null;
          if (hasMedical) rowTag = 'class-medical';
          if (hasBusiness) rowTag = 'class-business';
          if (hasPersonal) rowTag = 'class-personal';

          // If the event has a tag and that tag is unchecked, hide it
          if (rowTag && !activeTags.includes(rowTag)) {
            row.classList.add('hidden-event');
          } else {
            row.classList.remove('hidden-event');
          }
        });
      };

      // Run filter rule after every view render switch
      calendar.on('datesSet', function () {
        setTimeout(filterEvents, 0);
      });
      calendar.render();
    });
  </script>
</head>

<body>
  <div class="filter-container">
    <label class="filter-pill class-medical">
      <input type="checkbox" value="class-medical" checked onchange="filterEvents()"> Medical
    </label>
    <label class="filter-pill class-business">
      <input type="checkbox" value="class-business" checked onchange="filterEvents()"> Business
    </label>
    <label class="filter-pill class-personal">
      <input type="checkbox" value="class-personal" checked onchange="filterEvents()"> Personal
    </label>
  </div>
  <div id='calendar'></div>
</body>

</html>
