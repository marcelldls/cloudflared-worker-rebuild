<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src='./index.global.js'></script>
  <link rel="stylesheet" href="./styles.css">
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 1. Raw Event Data Source
      const eventData = [
        { title: 'All Day Event', start: '2026-05-01', classNames: ['class-medical', 'class-personal'], link: 'https://www.marcelldls.lol/0' },
        { title: 'Long Event', start: '2026-05-07', end: '2026-05-10', classNames: ['class-test'], link: 'https://www.marcelldls.lol/0' },
        { groupId: '999', title: 'Repeating Event', start: '2026-05-09T16:00:00', link: 'https://www.marcelldls.lol/0' },
        { groupId: '999', title: 'Repeating Event', start: '2026-05-16T16:00:00', link: 'https://www.marcelldls.lol/0' },
        { title: 'Conference', start: '2026-05-11', end: '2026-05-13', classNames: ['class-business', 'class-personal'], link: 'https://www.marcelldls.lol/0' },
        { title: 'Meeting', start: '2026-05-12T10:30:00', end: '2026-05-12T12:30:00', link: 'https://www.marcelldls.lol/0' },
        { title: 'Lunch', start: '2026-05-12T12:00:00', link: 'https://www.marcelldls.lol/0' },
        { title: 'Meeting', start: '2026-05-12T14:30:00', link: 'https://www.marcelldls.lol/0' },
        { title: 'Birthday Party', start: '2026-05-13T07:00:00', link: 'https://www.marcelldls.lol/0' },
        { title: 'Click for Google', start: '2026-05-28', link: 'https://www.marcelldls.lol/0' },
        { title: 'Dentist Checkup', start: '2026-05-25T10:00:00', end: '2026-05-25T11:30:00', classNames: ['class-medical'], link: 'https://www.marcelldls.lol/0' },
        { title: 'Quarterly Board Meeting', start: '2026-05-27T14:00:00', end: '2026-05-27T16:00:00', classNames: ['class-business'], link: 'https://www.marcelldls.lol/0' },
        { title: 'Dinner with Parents', start: '2026-05-29T19:00:00', classNames: ['class-personal', 'class-medical'], link: 'https://www.marcelldls.lol/0' }
      ];

      // 2. Pre-defined Standardised Non-Intrusive Palettes (bg, border, text)
      const colorPalettes = [
        { bg: '#e3f2fd', border: '#1e88e5', text: '#0d47a1' }, // Blue (Medical)
        { bg: '#ede7f6', border: '#5e35b1', text: '#4a148c' }, // Purple (Business)
        { bg: '#e8f5e9', border: '#43a047', text: '#1b5e20' }, // Green (Personal)
        { bg: '#fff3e0', border: '#fb8c00', text: '#e65100' }, // Orange (Fallback 1)
        { bg: '#fce4ec', border: '#d81b60', text: '#880e4f' }, // Pink (Fallback 2)
        { bg: '#e0f7fa', border: '#00acc1', text: '#006064' }, // Cyan (Fallback 3)
        { bg: '#f1f8e9', border: '#7cb342', text: '#33691e' }  // Light Green (Fallback 4)
      ];

      // Clean text tags dynamically ("class-medical" -> "Medical")
      function formatLabel(className) {
        if (!className) return '';
        return className.replace('class-', '').replace(/^\w/, c => c.toUpperCase());
      }

      // 3. Extract Unique Tags Safely
      const uniqueTags = Array.from(
        new Set(eventData.flatMap(evt => evt.classNames || []))
      ).filter(Boolean);

      // 4. Generate Dynamic CSS Styles targeting ONLY the badges & Inject them into <head>
      const styleEl = document.createElement('style');
      let dynamicStyles = `
        /* KEYBOARD FILTER FIX: Utility class to hide non-matching choices */
        .dropdown-item.hidden-item {
          display: none !important;
        }
      `;

      uniqueTags.forEach((tag, index) => {
        // Cycle through palettes sequentially if tags exceed palette count
        const palette = colorPalettes[index % colorPalettes.length];
        dynamicStyles += `
          .badge.${tag} {
            background-color: ${palette.bg} !important;
            border: 1px solid ${palette.border} !important;
            color: ${palette.text} !important;
          }
        `;
      });
      styleEl.innerHTML = dynamicStyles;
      document.head.appendChild(styleEl);

      // 5. Define Filter Logic
      function filterEvents() {
        // MECHANIC FIX: Replaced .dropdown-container query match with the unified .dropdown-item class
        const checkedInputs = Array.from(document.querySelectorAll('.dropdown-item input:checked'));
        const activeTags = checkedInputs.map(el => el.value);

        document.querySelectorAll('.fc-list-event').forEach(row => {
          const appliedTags = uniqueTags.filter(tag => row.classList.contains(tag));
          let shouldShow = true;

          if (appliedTags.length > 0) {
            shouldShow = appliedTags.some(tag => activeTags.includes(tag));
          }

          if (shouldShow) {
            row.classList.remove('hidden-event');
          } else {
            row.classList.add('hidden-event');
          }
        });

        // Handle empty day headers
        document.querySelectorAll('.fc-list-day').forEach(dayHeader => {
          let nextEl = dayHeader.nextElementSibling;
          let hasVisibleEvents = false;

          while (nextEl && nextEl.classList.contains('fc-list-event')) {
            if (!nextEl.classList.contains('hidden-event')) {
              hasVisibleEvents = true;
              break;
            }
            nextEl = nextEl.nextElementSibling;
          }

          if (hasVisibleEvents) {
            dayHeader.style.setProperty('display', '', 'important');
          } else {
            dayHeader.style.setProperty('display', 'none', 'important');
          }
        });

        if (calendar && calendar.updateSize) {
          calendar.updateSize();
        }
      }

      window.filterEvents = filterEvents;

      // 6. Generate Filter Dropdown Layout
      const dropdownContainer = document.getElementById('filterDropdown');
      if (dropdownContainer) {
        // KEYBOARD FILTER FIX: Injected search box template into the filter panel header
        dropdownContainer.innerHTML = `
          <input type="text" id="calendar-dropdown-search" placeholder="Type to filter..." style="width: calc(100% - 16px); margin: 8px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background: #fff; color: #333; font-size: 0.85rem;">
          <div id="calendar-dropdown-items-container"></div>
        `;

        const searchInput = document.getElementById('calendar-dropdown-search');
        const itemsContainer = document.getElementById('calendar-dropdown-items-container');

        // KEYBOARD FILTER FIX: Dynamic keyup filter listener matching badge layouts
        searchInput.addEventListener('keyup', () => {
          const filterText = searchInput.value.toLowerCase().trim();
          const items = itemsContainer.querySelectorAll('.dropdown-item');

          items.forEach(item => {
            const badgeText = item.querySelector('.badge').textContent.toLowerCase();
            if (badgeText.includes(filterText)) {
              item.classList.remove('hidden-item');
            } else {
              item.classList.add('hidden-item');
            }
          });
        });

        uniqueTags.forEach(tag => {
          const labelText = formatLabel(tag);
          const labelEl = document.createElement('label');
          labelEl.className = 'dropdown-item';
          labelEl.innerHTML = `
            <input type="checkbox" value="${tag}" checked>
            <span class="badge ${tag}">${labelText}</span>
          `;
          labelEl.querySelector('input').addEventListener('change', filterEvents);
          itemsContainer.appendChild(labelEl);
        });
      }

      const targetOrigin = window.location.hostname === 'localhost'
        ? window.location.origin
        : 'https://www.marcelldls.lol';

      const parsedTagsPayload = uniqueTags.map((tag, index) => {
        const palette = colorPalettes[index % colorPalettes.length];
        return {
          id: tag,
          label: formatLabel(tag),
          styles: `background-color: ${palette.bg}; border: 1px solid ${palette.border}; color: ${palette.text};`
        };
      });

      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'PARENT_READY') {
          window.parent.postMessage({
            type: 'CALENDAR_RENDERED_TAGS',
            payload: parsedTagsPayload
          }, targetOrigin);
        }
      });

      // 7. Initialize FullCalendar
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'listMonth',
        height: '100%',
        contentHeight: 'auto',
        aspectRatio: 1.3,
        headerToolbar: {
          left: 'prev,next',
          center: 'title',
          right: 'todayButton,externalLink'
        },
        customButtons: {
          todayButton: {
            text: '↓',
            hint: 'Today',
            click: function () {
              calendar.today();
            }
          },
          externalLink: {
            text: '⧉',
            hint: 'Fullscreen',
            click: function () {
              window.top.location.href = 'https://calender.marcelldls.lol';
            }
          }
        },
        eventClassNames: function (arg) {
          return arg.event.classNames || [];
        },
        eventContent: function (arg) {
          const titleText = arg.event.title;
          const classes = arg.event.classNames || [];

          const titleEl = document.createElement('span');
          titleEl.classList.add('fc-list-event-title-text');
          titleEl.innerText = titleText;

          const wrapEl = document.createElement('div');
          wrapEl.style.display = 'inline-block';
          wrapEl.appendChild(titleEl);

          if (classes.length > 0) {
            const tagsContainer = document.createElement('span');
            tagsContainer.classList.add('fc-tags-container');

            classes.forEach(cls => {
              const label = formatLabel(cls);
              const badge = document.createElement('span');
              badge.className = `badge ${cls}`;
              badge.innerText = label;
              tagsContainer.appendChild(badge);
            });
            wrapEl.appendChild(tagsContainer);
          }

          return { domNodes: [wrapEl] };
        },
        eventClick: function (info) {
          // Re-mapped to standard extended properties context definition matching eventData structure
          const targetLink = info.event.extendedProps.link || info.event.url;
          if (targetLink) {
            info.jsEvent.preventDefault();
            window.open(targetLink, '_blank');
          }
        },
        events: eventData
      });

      // 8. Toggle Dropdown Window Setup
      window.toggleDropdown = function (event) {
        event.stopPropagation();
        if (dropdownContainer) {
          dropdownContainer.classList.toggle('show');

          // Automatically clear input text and focus search field when opened
          if (dropdownContainer.classList.contains('show')) {
            const searchInput = document.getElementById('calendar-dropdown-search');
            const itemsContainer = document.getElementById('calendar-dropdown-items-container');
            if (searchInput && itemsContainer) {
              searchInput.value = '';
              itemsContainer.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('hidden-item'));
              searchInput.focus();
            }
          }
        }
      };

      document.addEventListener('click', function (event) {
        const container = document.querySelector('.dropdown-container');
        if (dropdownContainer && (!container || !container.contains(event.target))) {
          dropdownContainer.classList.remove('show');
        }
      });

      calendar.on('datesSet', function () {
        setTimeout(filterEvents, 0);
      });

      calendar.render();
    });
  </script>
</head>

<body>
  <div class="filter-wrapper">
    <div class="dropdown-container">
      <button class="dropdown-btn" onclick="toggleDropdown(event)">
        <span>Filter by Tags</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div class="dropdown-content" id="filterDropdown"></div>
    </div>
  </div>

  <div id="calendar"></div>
</body>

</html>
