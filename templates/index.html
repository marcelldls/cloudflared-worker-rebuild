<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src='/index.global.js'></script>
  <link rel="stylesheet" href="styles.css">
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'listMonth',
        height: '100%',
        contentHeight: 'auto',
        aspectRatio: 1.3,
        headerToolbar: {
          left: 'prev,next',
          center: 'title',
          right: 'externalLink'
        },
        customButtons: {
          externalLink: {
            text: 'Full Screen',
            click: function () {
              window.top.location.href = 'https://calender.marcelldls.lol';
            }
          }
        },
        // Ensures classes are attached directly to DOM rows for the filtering system
        eventClassNames: function (arg) {
          if (arg.event.classNames && arg.event.classNames.length) {
            return arg.event.classNames;
          }
          return [];
        },
        // Remaps the event element to strip full-row colors and render text tags inline instead
        eventContent: function (arg) {
          const titleText = arg.event.title;
          const classes = arg.event.classNames || [];

          // Create a wrapper element for the text title
          const titleEl = document.createElement('span');
          titleEl.classList.add('fc-list-event-title-text');
          titleEl.innerText = titleText;

          // Base block container
          const wrapEl = document.createElement('div');
          wrapEl.style.display = 'inline-block';
          wrapEl.appendChild(titleEl);

          // Render explicit layout badges inline next to the text title if tags exist
          if (classes.length > 0) {
            const tagsContainer = document.createElement('span');
            tagsContainer.classList.add('fc-tags-container');

            classes.forEach(cls => {
              let label = '';
              if (cls === 'class-medical') label = 'Medical';
              if (cls === 'class-business') label = 'Business';
              if (cls === 'class-personal') label = 'Personal';

              if (label) {
                const badge = document.createElement('span');
                badge.className = `badge ${cls}`;
                badge.innerText = label;
                tagsContainer.appendChild(badge);
              }
            });
            wrapEl.appendChild(tagsContainer);
          }

          return { domNodes: [wrapEl] };
        },
        eventClick: function (info) {
          if (info.event.url) {
            info.jsEvent.preventDefault();
            window.open(info.event.url, '_blank');
          }
        },
        events: [
          {
            title: 'All Day Event',
            start: '2026-05-01',
            classNames: ['class-medical', 'class-personal']
          },
          {
            title: 'Long Event',
            start: '2026-05-07',
            end: '2026-05-10',
            classNames: ['class-personal']
          },
          {
            groupId: '999',
            title: 'Repeating Event',
            start: '2026-05-09T16:00:00'
          },
          {
            groupId: '999',
            title: 'Repeating Event',
            start: '2026-05-16T16:00:00'
          },
          {
            title: 'Conference',
            start: '2026-05-11',
            end: '2026-05-13',
            classNames: ['class-business', 'class-personal']
          },
          {
            title: 'Meeting',
            start: '2026-05-12T10:30:00',
            end: '2026-05-12T12:30:00'
          },
          {
            title: 'Lunch',
            start: '2026-05-12T12:00:00'
          },
          {
            title: 'Meeting',
            start: '2026-05-12T14:30:00'
          },
          {
            title: 'Birthday Party',
            start: '2026-05-13T07:00:00'
          },
          {
            title: 'Click for Google',
            url: 'https://google.com/',
            start: '2026-05-28'
          },
          {
            title: 'Dentist Checkup',
            start: '2026-05-25T10:00:00',
            end: '2026-05-25T11:30:00',
            classNames: ['class-medical']
          },
          {
            title: 'Quarterly Board Meeting',
            start: '2026-05-27T14:00:00',
            end: '2026-05-27T16:00:00',
            classNames: ['class-business']
          },
          {
            title: 'Dinner with Parents',
            start: '2026-05-29T19:00:00',
            classNames: ['class-personal', 'class-medical']
          }
        ]
      });

      // Drops down or collapses multi-select checkbox menu container layout boxes
      window.toggleDropdown = function (event) {
        event.stopPropagation();
        document.getElementById('filterDropdown').classList.toggle('show');
      };

      // Closes open popups safely if clicking active viewport white space areas
      document.addEventListener('click', function (event) {
        const dropdown = document.getElementById('filterDropdown');
        const container = document.querySelector('.dropdown-container');
        if (dropdown && !container.contains(event.target)) {
          dropdown.classList.remove('show');
        }
      });

      // Iterates through views filtering tags or cleanup actions
      window.filterEvents = function () {
        const activeTags = Array.from(document.querySelectorAll('.dropdown-container input:checked')).map(el => el.value);
        const knownTags = ['class-medical', 'class-business', 'class-personal'];

        document.querySelectorAll('.fc-list-event').forEach(row => {
          const appliedTags = knownTags.filter(tag => row.classList.contains(tag));
          let shouldShow = true;

          // Event must match at least one selected category check option to display
          if (appliedTags.length > 0) {
            shouldShow = appliedTags.some(tag => activeTags.includes(tag));
          }

          if (shouldShow) {
            row.classList.remove('hidden-event');
          } else {
            row.classList.add('hidden-event');
          }
        });

        // Remove empty header bars when matching event items are hidden away
        document.querySelectorAll('.fc-list-day').forEach(dayHeader => {
          let nextEl = dayHeader.nextElementSibling;
          let hasVisibleEvents = false;

          while (nextEl && nextEl.classList.contains('fc-list-event')) {
            if (!nextEl.classList.contains('hidden-event')) {
              hasVisibleEvents = true;
              break;
            }
            nextEl = nextEl.nextElementSibling;
          }

          if (hasVisibleEvents) {
            dayHeader.style.setProperty('display', '', 'important');
          } else {
            dayHeader.style.setProperty('display', 'none', 'important');
          }
        });

        // Fixes sticky rendering calculations
        if (calendar && calendar.updateSize) {
          calendar.updateSize();
        }
      };

      // Run filters whenever the view dates jump or alternate
      calendar.on('datesSet', function () {
        setTimeout(filterEvents, 0);
      });

      calendar.render();
    });

  </script>
</head>

<body>
  <div class="filter-wrapper">
    <div class="dropdown-container">
      <button class="dropdown-btn" onclick="toggleDropdown(event)">
        <span>Filter by Tags</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div class="dropdown-content" id="filterDropdown">
        <label class="dropdown-item">
          <input type="checkbox" value="class-medical" checked onchange="filterEvents()">
          <span class="badge class-medical">Medical</span>
        </label>
        <label class="dropdown-item">
          <input type="checkbox" value="class-business" checked onchange="filterEvents()">
          <span class="badge class-business">Business</span>
        </label>
        <label class="dropdown-item">
          <input type="checkbox" value="class-personal" checked onchange="filterEvents()">
          <span class="badge class-personal">Personal</span>
        </label>
      </div>
    </div>
  </div>
  <div id='calendar'></div>
</body>

</html>
