<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prerendered Event Calendar</title>
  <!-- FullCalendar Engine -->
  <script src="https://jsdelivr.net"></script>
  <style>
    #calendar { max-width: 900px; margin: 40px auto; font-family: sans-serif; }
    /* Disables all element selection, drag features, and links */
    .fc-event { pointer-events: none; cursor: default; user-select: none; } 
  </style>
</head>
<body>

  <div id="calendar"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');

      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,listMonth'
        },
        // Safe flat data compiled directly by our Python service
        events: {{ events_json | safe }}
      });

      calendar.render();
    });
  </script>

</body>
</html>
