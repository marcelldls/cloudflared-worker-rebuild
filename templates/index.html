<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src='/index.global.js'></script>
  <link rel="stylesheet" href="styles.css">
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'listMonth',
        height: '100%',
        contentHeight: 'auto',
        aspectRatio: 1.3,
        headerToolbar: {
          left: 'prev,next',
          center: 'title',
          right: 'externalLink'
        },
        customButtons: {
          externalLink: {
            text: 'Full Screen',
            click: function () {
              window.top.location.href = 'https://calender.marcelldls.lol';
            }
          }
        },
        // Hook to preserve user custom class categories during layout passes
        eventClassNames: function (arg) {
          if (arg.event.classNames && arg.event.classNames.length) {
            return arg.event.classNames;
          }
          return [];
        },
        eventClick: function (info) {
          if (info.event.url) {
            info.jsEvent.preventDefault();
            window.open(info.event.url, '_blank');
          }
        },
        events: [
          {
            title: 'All Day Event',
            start: '2026-05-01',
            classNames: ['class-medical', 'class-personal']
          },
          {
            title: 'Long Event',
            start: '2026-05-07',
            end: '2026-05-10',
            classNames: ['class-personal']
          },
          {
            groupId: '999',
            title: 'Repeating Event',
            start: '2026-05-09T16:00:00'
          },
          {
            groupId: '999',
            title: 'Repeating Event',
            start: '2026-05-16T16:00:00'
          },
          {
            title: 'Conference',
            start: '2026-05-11',
            end: '2026-05-13'
          },
          {
            title: 'Meeting',
            start: '2026-05-12T10:30:00',
            end: '2026-05-12T12:30:00'
          },
          {
            title: 'Lunch',
            start: '2026-05-12T12:00:00'
          },
          {
            title: 'Meeting',
            start: '2026-05-12T14:30:00'
          },
          {
            title: 'Birthday Party',
            start: '2026-05-13T07:00:00'
          },
          {
            title: 'Click for Google',
            url: 'https://google.com/',
            start: '2026-05-28'
          },
          {
            title: 'Dentist Checkup',
            start: '2026-05-25T10:00:00',
            end: '2026-05-25T11:30:00',
            classNames: ['class-medical']
          },
          {
            title: 'Quarterly Board Meeting',
            start: '2026-05-27T14:00:00',
            end: '2026-05-27T16:00:00',
            classNames: ['class-business']
          },
          {
            title: 'Dinner with Parents',
            start: '2026-05-29T19:00:00',
            classNames: ['class-personal']
          }
        ]
      });

      // Displays or collapses filter select content lists
      window.toggleDropdown = function (event) {
        event.stopPropagation();
        document.getElementById('filterDropdown').classList.toggle('show');
      };

      // Automatically shuts active popups safely if clicking calendar data areas
      document.addEventListener('click', function (event) {
        const dropdown = document.getElementById('filterDropdown');
        const container = document.querySelector('.dropdown-container');
        if (dropdown && !container.contains(event.target)) {
          dropdown.classList.remove('show');
        }
      });

      window.filterEvents = function () {
        // 1. Get an array of all currently checked tag values from the dropdown
        const activeTags = Array.from(document.querySelectorAll('.dropdown-container input:checked'))
          .map(el => el.value);

        // Define our known classification system tags
        const knownTags = ['class-medical', 'class-business', 'class-personal'];

        // 2. Loop through all rendered calendar event rows
        document.querySelectorAll('.fc-list-event').forEach(row => {
          // Collect all known tags that are actually applied to this specific event row
          const appliedTags = knownTags.filter(tag => row.classList.contains(tag));

          let shouldShow = true;

          // If the event has tags, it must match at least one active filter to stay visible
          if (appliedTags.length > 0) {
            shouldShow = appliedTags.some(tag => activeTags.includes(tag));
          }

          // Apply or remove your hidden-event style class
          if (shouldShow) {
            row.classList.remove('hidden-event');
          } else {
            row.classList.add('hidden-event');
          }
        });

        // 3. Clean up empty list day headers that have no visible events left under them
        document.querySelectorAll('.fc-list-day').forEach(dayHeader => {
          let nextEl = dayHeader.nextElementSibling;
          let hasVisibleEvents = false;

          // Scan forward through following rows until hitting the next day block container
          while (nextEl && nextEl.classList.contains('fc-list-event')) {
            if (!nextEl.classList.contains('hidden-event')) {
              hasVisibleEvents = true;
              break;
            }
            nextEl = nextEl.nextElementSibling;
          }

          // Hide or show the day header row safely
          if (hasVisibleEvents) {
            dayHeader.style.setProperty('display', '', 'important');
          } else {
            dayHeader.style.setProperty('display', 'none', 'important');
          }
        });

        // 4. Force FullCalendar layout engine to update view bounds
        if (calendar && calendar.updateSize) {
          calendar.updateSize();
        }
      };

      // Run filter checks on initial render and view switches
      calendar.on('datesSet', function () {
        setTimeout(filterEvents, 0);
      });

      calendar.render();
    });
  </script>
</head>

<body>
  <div class="filter-wrapper">
    <div class="dropdown-container">
      <button class="dropdown-btn" onclick="toggleDropdown(event)">
        <span>Filter by Tags</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div class="dropdown-content" id="filterDropdown">
        <label class="dropdown-item">
          <input type="checkbox" value="class-medical" checked onchange="filterEvents()">
          <span class="badge class-medical">Medical</span>
        </label>
        <label class="dropdown-item">
          <input type="checkbox" value="class-business" checked onchange="filterEvents()">
          <span class="badge class-business">Business</span>
        </label>
        <label class="dropdown-item">
          <input type="checkbox" value="class-personal" checked onchange="filterEvents()">
          <span class="badge class-personal">Personal</span>
        </label>
      </div>
    </div>
  </div>
  <div id='calendar'></div>
</body>

</html>
