<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src='/index.global.js'></script>
  <link rel="stylesheet" href="styles.css">
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'listMonth',
        height: '100%',
        contentHeight: 'auto',
        aspectRatio: 1.3,
        headerToolbar: {
          left: 'prev,next',
          center: 'title',
          right: 'externalLink'
        },
        customButtons: {
          externalLink: {
            text: 'Full Screen',
            click: function () {
              window.top.location.href = 'https://calender.marcelldls.lol';
            }
          }
        },
        eventClassNames: function (arg) {
          if (arg.event.classNames.length) {
            return arg.event.classNames;
          }
          return [];
        },
        eventClick: function (info) {
          if (info.event.url) {
            info.jsEvent.preventDefault();
            window.open(info.event.url, '_blank');
          }
        },
        events: [
          {
            title: 'All Day Event',
            start: '2026-05-01',
            className: 'class-medical'
          },
          {
            title: 'Long Event',
            start: '2026-05-07',
            end: '2026-05-10',
            className: 'class-personal'
          },
          {
            groupId: '999',
            title: 'Repeating Event',
            start: '2026-05-09T16:00:00'
          },
          {
            groupId: '999',
            title: 'Repeating Event',
            start: '2026-05-16T16:00:00'
          },
          {
            title: 'Conference',
            start: '2026-05-11',
            end: '2026-05-13'
          },
          {
            title: 'Meeting',
            start: '2026-05-12T10:30:00',
            end: '2026-05-12T12:30:00'
          },
          {
            title: 'Lunch',
            start: '2026-05-12T12:00:00'
          },
          {
            title: 'Meeting',
            start: '2026-05-12T14:30:00'
          },
          {
            title: 'Birthday Party',
            start: '2026-05-13T07:00:00'
          },
          {
            title: 'Click for Google',
            url: 'https://google.com/',
            start: '2026-05-28'
          },
          {
            title: 'Dentist Checkup',
            start: '2026-05-25T10:00:00',
            end: '2026-05-25T11:30:00',
            className: 'class-medical'
          },
          {
            title: 'Quarterly Board Meeting',
            start: '2026-05-27T14:00:00',
            end: '2026-05-27T16:00:00',
            className: 'class-business'
          },
          {
            title: 'Dinner with Parents',
            start: '2026-05-29T19:00:00',
            className: 'class-personal'
          }
        ]
      });

      // Displays or collapses filter select content lists
      window.toggleDropdown = function (event) {
        event.stopPropagation();
        document.getElementById('filterDropdown').classList.toggle('show');
      };

      // Automatically shuts active popups safely if clicking calendar data areas
      document.addEventListener('click', function (event) {
        const dropdown = document.getElementById('filterDropdown');
        const container = document.querySelector('.dropdown-container');
        if (dropdown && !container.contains(event.target)) {
          dropdown.classList.remove('show');
        }
      });

      window.filterEvents = function () {
        // Find all unchecked tag values
        const activeTags = Array.from(document.querySelectorAll('.dropdown-container input:checked')).map(el => el.value);

        // Loop through all rendered list event rows
        document.querySelectorAll('.fc-list-event').forEach(row => {
          // Check if row has any of the classification classes
          const hasMedical = row.classList.contains('class-medical');
          const hasBusiness = row.classList.contains('class-business');
          const hasPersonal = row.classList.contains('class-personal');

          // Determine if this row belongs to any tag category
          let rowTag = null;
          if (hasMedical) rowTag = 'class-medical';
          if (hasBusiness) rowTag = 'class-business';
          if (hasPersonal) rowTag = 'class-personal';

          // If the event has a tag and that tag is unchecked, hide it
          if (rowTag && !activeTags.includes(rowTag)) {
            row.classList.add('hidden-event');
          } else {
            row.classList.remove('hidden-event');
          }
        });
      };

      // Run filter rule after every view render switch
      calendar.on('datesSet', function () {
        setTimeout(filterEvents, 0);
      });
      calendar.render();
    });
  </script>
</head>

<body>
  <div class="filter-wrapper">
    <div class="dropdown-container">
      <button class="dropdown-btn" onclick="toggleDropdown(event)">
        <span>Filter by Tags</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div class="dropdown-content" id="filterDropdown">
        <label class="dropdown-item">
          <input type="checkbox" value="class-medical" checked onchange="filterEvents()">
          <span class="badge class-medical">Medical</span>
        </label>
        <label class="dropdown-item">
          <input type="checkbox" value="class-business" checked onchange="filterEvents()">
          <span class="badge class-business">Business</span>
        </label>
        <label class="dropdown-item">
          <input type="checkbox" value="class-personal" checked onchange="filterEvents()">
          <span class="badge class-personal">Personal</span>
        </label>
        <!-- You can easily copy and paste more items here as your tag list grows -->
      </div>
    </div>
  </div>
  <div id='calendar'></div>
</body>

</html>
